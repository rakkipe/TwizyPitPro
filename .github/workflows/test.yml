name: Archive integrity checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # This checkout is an archive. Application dependencies and sources are
      # incomplete; the active app lives outside this repository. These checks
      # do not validate the active app or qualify PowerBox safety controls.
      - name: Check archive documents and JSON syntax
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          for name in ("README.md", "GEBRUIK-NA-OPRUIMING.md", "LICENSE", "SECURITY.md", "THIRD_PARTY_NOTICES.md"):
              if not Path(name).read_text(encoding="utf-8-sig").strip():
                  raise SystemExit(f"Empty archive document: {name}")

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          for name in tracked:
              if name.endswith(".json"):
                  with Path(name).open(encoding="utf-8-sig") as source:
                      json.load(source)
                  print(f"Valid JSON syntax: {name}")

      - name: Parse retained PowerShell scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = git ls-files -- '*.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list tracked PowerShell scripts' }
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw "PowerShell syntax errors in ${script}: $($parseErrors -join '; ')"
            }
            Write-Host "Valid PowerShell syntax: $script"
          }
